<section class="lux-hero" aria-label="Hero">
  <div class="lux-hero-shell">
    <div id="carouselExample" class="carousel slide perent lux-hero-carousel" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://www.traveltoindia.org/tour_images/chardhambusrental-1753686364.jpg" class="d-block w-100" alt="Char Dham bus travel">
            </div>

            <div class="carousel-item">
                <img src="https://gst-contracts.s3.ap-southeast-1.amazonaws.com/uploads/bcc/cms/asset/avatar/397717/aa.jpg" class="d-block w-100" alt="Luxury minibus">
            </div>

            <div class="carousel-item">
                <img src="https://wallpaperaccess.com/full/1628640.jpg" class="d-block w-100" alt="Char Dham yatra by bus">
            </div>
        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev" aria-label="Previous slide">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next" aria-label="Next slide">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
        </button>
    </div>

    <div class="lux-hero-copy">
      <p class="lux-eyebrow">YatraSetu</p>
      <h1 class="lux-hero-title">India  bus journeys, made<br> effortless</h1>
      <p class="lux-hero-subtitle">Find routes, plan on the map, and explore updates — all in one premium experience.</p>
      <div class="lux-hero-actions">
        <a class="lux-btn lux-btn--primary" href="{% url 'routes' %}">Explore routes</a>
        <a class="lux-btn lux-btn--ghost" href="{% url 'CTL' %}">Contact / Sign in</a>
      </div>
    </div>
  </div>
</section>
