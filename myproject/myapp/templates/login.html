{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — YatraSetu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'style.css' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="lux-body lux-login-page">
  {% include 'headar.html' %}

  <main class="lux-login-stage">
    <div class="lux-login-glow" aria-hidden="true"></div>
    <div class="lux-login-card">
      <div class="lux-login-card-accent" aria-hidden="true"></div>
      <header class="lux-login-header">
        <p class="lux-eyebrow">Member access</p>
        <h1 class="lux-login-title">Welcome back</h1>
        <p class="lux-login-lead">Sign in to manage bookings and explore curated routes.</p>
      </header>

      <form method="POST" class="lux-login-form">
        {% csrf_token %}
        <label class="lux-field">
          <span class="lux-field-label">Username</span>
          <input type="text" name="username" autocomplete="username" placeholder="Your username" class="lux-input" required>
        </label>
        <label class="lux-field">
          <span class="lux-field-label">Password</span>
          <input type="password" name="password" autocomplete="current-password" placeholder="••••••••" class="lux-input" required>
        </label>
        <button type="submit" class="lux-btn lux-btn--primary lux-login-submit">Sign in</button>
      </form>

      {% if error %}
      <p class="lux-login-error" role="alert">{{ error }}</p>
      {% endif %}

      <p class="lux-login-foot">
        <a class="lux-login-link" href="{% url 'perent' %}">← Back to home</a>
      </p>
    </div>
  </main>

  {% include 'footer.html' %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
